    err.textContent = ''; go.disabled = true;
    var key;
    subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
      return subtle.exportKey('raw', key).then(function (raw) {
        try { localStorage.setItem(store, b64(new Uint8Array(raw))); } catch (e) {}
        track('proposal_unlock'); open(html);
      });
    }).catch(function () {
      track('proposal_unlock_failed');
      err.textContent = "That password didn't work.";
      go.disabled = false; pw.select();
    });
  });
})();
</script>
